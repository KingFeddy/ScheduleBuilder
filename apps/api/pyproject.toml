[project]
name = "schedule-builder-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "sentry-sdk[fastapi,sqlalchemy]>=2.0",
    "slowapi>=0.1.9",
    "playwright>=1.60.0",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "database: requires the explicitly configured disposable PostgreSQL test database",
    "docker: opt-in Docker context/image checks (set RUN_DOCKER_TESTS=1)",
    "docker_image: builds and inspects full production images (requires Docker and downloads)",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.0",
]
