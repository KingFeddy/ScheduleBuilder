[project]
name = "schedule-builder-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "sentry-sdk[fastapi,sqlalchemy]>=2.0",
    "slowapi>=0.1.9",
    "playwright>=1.60.0",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "hypothesis>=6.0",
]
