# Legacy Config-as-code only. New Railway services must set these values in
# the dashboard: root /apps/api, Dockerfile path Dockerfile,
# start command and cron schedule below, no healthcheck. Run after section import.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uv run --no-sync python -m src.scrapers.metadata_cron"
cronSchedule = "0 7 * * *"
restartPolicyType = "NEVER"
