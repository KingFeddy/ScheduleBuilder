name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: njit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Initialize disposable test database
        run: psql postgresql://postgres:postgres@localhost:5432/njit_test -v ON_ERROR_STOP=1 -f apps/api/tests/init_test_database.sql

      - name: Apply versioned database migrations
        working-directory: apps/api
        env:
          MIGRATION_DATABASE_URL: postgresql+asyncpg://njit_test:test-only@localhost:5432/njit_test
        run: uv run --no-sync python -m scripts.migrate apply

      - name: Run backend tests
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://njit_test:test-only@localhost:5432/njit_test
          APP_ENV: test
        run: uv run pytest tests/ -v --tb=short

  test-frontend:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: apps/web
        run: pnpm typecheck

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

  deploy-backend:
    name: Deploy to Railway
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen --no-dev

      - name: Verify production DB schema
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SUPABASE_URL: unused
          SUPABASE_ANON_KEY: unused
          CORS_ORIGINS: unused
          APP_ENV: production
          CURRENT_TERM: "202690"
        run: uv run python scripts/verify_migrations.py

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --detach

      - name: Deploy Scraper service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service scraper --detach
