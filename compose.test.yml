name: schedule-builder-tests

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: njit_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./apps/api/tests/init_test_database.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U njit_test -d njit_test"]
      interval: 2s
      timeout: 3s
      retries: 20
